<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧩</text></svg>" />
  <title>Kapuzinho 3D - Ferramentas STL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app">
    <header class="topo">
      <div class="marca">Kapuzinho 3D<small>Ferramentas STL</small></div>
      <select id="selMesa" aria-label="Impressora"></select>
      <label class="btn" for="arquivo">Abrir STL</label>
      <input id="arquivo" type="file" accept=".stl" hidden />
      <button class="btn" id="btnDesfazer" disabled title="Desfazer a última modificação (Ctrl+Z)">↶ Desfazer</button>
      <button class="btn" id="btnRefazer" disabled title="Refazer (Ctrl+Y)">↷ Refazer</button>
      <button class="btn" id="btnOriginal" disabled title="Desfaz tudo e volta pra peça como foi aberta">⟲ Original</button>
      <button class="btn" id="btnLimpar" disabled title="Fecha a peça pra abrir outra">✕ Limpar</button>
      <button class="btn" id="btnBaixar" disabled>Baixar STL</button>
      <a class="btn btn-wpp" id="btnWpp" target="_blank" rel="noopener" title="Falar comigo no WhatsApp">WhatsApp</a>
    </header>
    <nav class="trilho" id="trilho" aria-label="Ferramentas"></nav>
    <main class="palco" id="palco">
      <div id="viewport"></div>
      <div class="vistas" id="vistas"></div>
      <div class="vazio" id="vazio">Arraste um arquivo STL pra cá ou use Abrir STL</div>
      <div class="info-peca" id="infoPeca" hidden></div>
      <div class="previa2d" id="previa2d" hidden></div>
      <div id="editor2d" hidden></div>
      <div class="editor-topo" id="editorTopo" hidden></div>
    </main>
    <aside class="painel" id="painel"></aside>
    <footer class="log" id="log">Carregando o motor 3D…</footer>
  </div>
  <div class="ocupado" id="ocupado" hidden><span>Processando…</span></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
